[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-nlp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.5",
    "requests>=2.31",
    "httpx>=0.27",
    "sacrebleu>=2.4",
    "nltk>=3.8",
    "jiwer>=3.0",
    "langfuse>=2.0",
    "langchain-core>=0.2",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    # Deps nécessaires aux tests unitaires cross-service :
    "python-jose[cryptography]>=3.3",  # gateway JWT
    "bcrypt>=4.0",                     # gateway password hashing
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: tests appelant les services HTTP (docker compose up requis)",
    "slow: tests longs (> 10s) — pipeline complet avec Whisper/LLM/TTS",
    "e2e: tests bout-en-bout via UI (Playwright, à venir)",
]
